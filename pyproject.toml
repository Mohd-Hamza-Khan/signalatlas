[tool.poetry]
name = "signal-atlas"
version = "0.1.0"
description = "FrontierAtlas Intelligence Ingestion Engine - AI ecosystem data pipeline"
authors = ["FrontierAtlas Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"

# Core dependencies
aiohttp = "^3.9.0"
asyncpg = "^0.29.0"
pydantic = "^2.6.0"

# LLM & Orchestration
langgraph = "^0.0.17"
openrouter = "^0.1.0"

# Database
pgvector = "^0.2.0"

# HTTP & Parsing
beautifulsoup4 = "^4.12.0"
lxml = "^5.1.0"

# Async utilities
httpx = "^0.27.0"

# Data processing
pandas = "^2.2.0"
numpy = "^1.26.0"

# Text processing
unidecode = "^1.3.0"
rapidfuzz = "^3.6.0"

# Playwright for JS rendering
playwright = "^1.44.0"

# Google Sheets
gspread = "^6.0.0"
oauth2client = "^4.1.0"

# Logging
structlog = "^24.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
black = "^24.2.0"
ruff = "^0.3.0"
mypy = "^1.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
